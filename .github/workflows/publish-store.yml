name: Verificar e publicar MadsDeck Store
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - catalog.signed.json
      - catalog_public.b64
      - extension_public_keys.csv
      - packages/**
      - verify_store.py
      - .github/workflows/publish-store.yml
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "madsdeck-pages"
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar biblioteca criptografica
        run: python -m pip install cryptography
      - name: Verificar catalogo e 10 pacotes assinados, sem executar binaries
        run: python verify_store.py
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Artefato Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
