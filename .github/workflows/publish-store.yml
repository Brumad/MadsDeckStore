name: Verificar MadsDeck Store (10 extensoes, sem Medal)

# O Pages deste repositorio e publicado diretamente pela branch main.
# Este workflow verifica o catalogo assinado e as 10 extensoes.
# Nao faz um segundo deploy nem executa arquivos .mdx.
on:
  push:
    branches: [main]
    paths:
      - 'catalog.signed.json'
      - 'catalog_public.b64'
      - 'extension_public_keys.csv'
      - 'packages/**'
      - 'verify_store.py'
      - '.github/workflows/publish-store.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verificar catalogo e pacotes assinados
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter arquivos da Store
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar biblioteca para verificação Ed25519
        run: python -m pip install cryptography
      - name: Verificar catalogo e 10 extensoes sem executar binarios
        run: python verify_store.py
